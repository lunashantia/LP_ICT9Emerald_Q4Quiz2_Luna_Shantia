<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Analyzer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"; rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>;

    <style>
        body {background-color: cornsilk;}

        h1 {font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;}
    </style>

</head>
<body>
    
<h1 style="color: cadetblue; text-align: center;">Grade Analyzer</h1>


<details ontoggle="message()">
    <summary style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; text-align: center; color: cadetblue;"><b>HOW TO:</b></summary>
    <i><p style="text-align: center; color: cadetblue;">Input your grades for each subject to calculate your average.</p></i>
</details>

<div class="container mt-5">
    <div class="row text-center">      
      <div class="col-md-6">
        
        <img src="images (2).jpg" alt="eng" class="img-fluid" style="width: 200px; border: 5px solid cornflowerblue;">
       
        <form class="mt-3">
        <input type="number" class="form-control mx-auto" placeholder="Add grade here" style="width: 200px;" id="eng">
        </form>

      </div>
      <div class="col-md-6">
        <img src="images.jpg" alt="sci" class="img-fluid" style="width: 200px; border: 5px solid cornflowerblue;">
        <form class="mt-3">
        <input type="number" class="form-control mx-auto" placeholder="Add grade here" style="width: 200px;" id="sci">
    </form>
    </div>
    </div>

    <div class="row text-center mt-5">
      <div class="col-md-6 offset-md-3">
        <img src="images 3.jpg" alt="math" class="img-fluid" style="width: 200px; border: 5px solid cornflowerblue;">
        <form class="mt-3">
          <input type="number" class="form-control mx-auto" placeholder="Add grade here" style="width: 200px;" id="math">
        </form>
      </div>
</div>
</div>

<div class="text-center mt-4">
    <button type="submit" class="btn btn-primary" onclick="calc()">Calculate</button>
  </div>


  <script>
    function calc() {

        var eng = parseFloat(document.getElementById("eng").value);
        var sci = parseFloat(document.getElementById("sci").value);
        var math = parseFloat(document.getElementById("math").value);


    var avg = (eng + sci + math)/3

    if (avg >=70 && avg <=74.99){
        alert("Grade is Poor");
    }


    else if (avg >=75 && avg <=79.99)
    {
        alert("Grade needs improvement");
    }


    else if (avg >=80 && avg <=86.99)
    {
        alert("Grade is Satisfactory");
    }


    else if (avg >=87 && avg <=93.99)
    {
        alert("Grade is above satisfactory");
    }


    else if (avg >=94 && avg <=100)
    {
        alert("Grade is excellent");
    }


    }
  </script>


</body>
</html>
